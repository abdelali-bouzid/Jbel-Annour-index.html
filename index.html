<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART MAINTENANCE PRO V12.1</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="flex flex-col min-h-full text-slate-800 bg-slate-100">

    <!-- شاشة تسجيل الدخول -->
    <div id="auth-screen" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-8 border border-slate-700">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full mb-4">
                    <i class="fa-solid fa-shield-halved text-3xl"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-900">Plateforme de Maintenance</h2>
                <p class="text-sm text-slate-500 mt-1">GMAO • Stock • Demandes d'Achat</p>
            </div>

            <div id="loginError" class="hidden mb-4 p-3 bg-red-100 border border-red-400 text-red-700 text-xs rounded-lg flex items-center gap-2">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span>Mot de passe incorrect ou champ vide.</span>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Utilisateur / Email</label>
                    <input type="text" id="loginEmail" required value="admin@usine.com" class="w-full px-4 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Mot de passe</label>
                    <div class="relative">
                        <input type="password" id="loginPassword" required value="admin123" class="w-full px-4 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500 pr-10">
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-indigo-600">
                            <i id="togglePasswordIcon" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Rôle Utilisateur</label>
                    <select id="loginRole" class="w-full border rounded-lg p-2 text-sm bg-white outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="Admin">Administrateur (Accès Total)</option>
                        <option value="Responsable">Responsable Maintenance</option>
                        <option value="Technicien">Technicien</option>
                    </select>
                </div>

                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg shadow-lg transition">
                    <i class="fa-solid fa-right-to-bracket mr-2"></i> Se Connecter
                </button>
            </form>
        </div>
    </div>

    <!-- الشاشة الرئيسية بعد الدخول -->
    <div id="app-screen" class="hidden flex flex-col min-h-screen">
        <header class="bg-slate-900 text-white shadow-md sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-gears text-2xl text-indigo-400"></i>
                    <h1 class="text-xl font-bold">SMART MAINTENANCE <span class="text-xs bg-indigo-600 px-2 py-0.5 rounded text-white">PRO V12.1</span></h1>
                </div>
                <div class="flex items-center gap-4">
                    <span class="text-sm font-semibold text-indigo-300" id="userDisplay">Admin</span>
                    <button onclick="handleLogout()" class="bg-red-600/20 hover:bg-red-600 text-red-300 hover:text-white px-3 py-1.5 rounded text-sm transition border border-red-500/30">
                        <i class="fa-solid fa-power-off mr-1"></i> Déconnexion
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-xl font-bold text-indigo-600 mb-2">Espace de Travail Opérationnel</h2>
                <p class="text-sm text-slate-600">Connexion réussie avec succès. Bienvenue sur la plateforme.</p>
            </div>
        </main>
    </div>

    <!-- JavaScript الأساسي والخالي من الأخطاء -->
    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('loginPassword');
            const toggleIcon = document.getElementById('togglePasswordIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const role = document.getElementById('loginRole').value;
            const pwd = document.getElementById('loginPassword').value.trim();

            if (pwd !== "") {
                document.getElementById('userDisplay').innerText = role;
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                document.getElementById('loginError').classList.add('hidden');
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }

        function handleLogout() {
            document.getElementById('app-screen').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('hidden');
        }
    </script>
</body>
</html>

<div class="box" style="margin-top: 20px;">
    <h3>📍 Gestion des Zones, Salles & Équipements</h3>
    
    <!-- Formulaire d'ajout -->
    <form id="assetForm" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 15px;">
        <input type="text" id="zoneName" placeholder="Zone (ex: Zone A)" required style="padding: 8px;">
        <input type="text" id="roomCode" placeholder="Code Salle (ex: R-101)" required style="padding: 8px;">
        <input type="text" id="assetName" placeholder="Nom Équipement" required style="padding: 8px;">
        <button type="submit" style="background: #2563eb; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">+ Ajouter Équipement</button>
    </form>

    <!-- Table des Équipements & Cartographie -->
    <table id="assetTable">
        <thead>
            <tr>
                <th>Code Chiffré (ID)</th>
                <th>Zone</th>
                <th>Salle</th>
                <th>Équipement</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><code>Z1-R101-EQ01</code></td>
                <td>Zone Industrielle 1</td>
                <td>Salle 101</td>
                <td>Compresseur A1</td>
                <td><button style="background: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer;" onclick="this.closest('tr').remove()">Supprimer</button></td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    // Ajouter un équipement dynamiquement avec encodage/chiffrement du code salle
    document.getElementById('assetForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const zone = document.getElementById('zoneName').value;
        const room = document.getElementById('roomCode').value;
        const asset = document.getElementById('assetName').value;
        
        // Génération du code chiffré unique
        const generatedCode = `${zone.substring(0, 2).toUpperCase()}-${room.toUpperCase()}-${Math.floor(1000 + Math.random() * 9000)}`;

        const tbody = document.querySelector('#assetTable tbody');
        const row = document.createElement('tr');
        row.innerHTML = `
            <td><code>${generatedCode}</code></td>
            <td>${zone}</td>
            <td>${room}</td>
            <td>${asset}</td>
            <td><button style="background: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer;" onclick="this.closest('tr').remove()">Supprimer</button></td>
        `;
        
        tbody.appendChild(row);
        this.reset();
    });
</script>

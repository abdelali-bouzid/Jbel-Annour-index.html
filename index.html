<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plateforme Sage X3 & GMAO</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      margin: 0;
      padding: 20px;
    }

    .notification-container {
      position: relative;
      display: inline-block;
    }

    .notif-btn {
      background-color: #1e293b;
      color: #ffffff;
      border: 1px solid #334155;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      position: relative;
    }

    .badge {
      position: absolute;
      top: -6px;
      right: -6px;
      background-color: #ef4444;
      color: white;
      border-radius: 50%;
      padding: 2px 6px;
      font-size: 11px;
      font-weight: bold;
    }

    .notif-dropdown {
      display: none;
      position: absolute;
      top: 45px;
      left: 0;
      width: 300px;
      background-color: #1e293b;
      border: 1px solid #334155;
      box-shadow: 0px 4px 12px rgba(0,0,0,0.3);
      border-radius: 6px;
      z-index: 1000;
    }

    .notif-item {
      padding: 12px;
      border-bottom: 1px solid #334155;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .notif-item:hover {
      background-color: #334155;
    }

    .unread-dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
      display: inline-block;
    }
  </style>
</head>
<body>

  <div class="notification-container">
    <button class="notif-btn" id="notifToggleBtn">
      🔔 Notifications
      <span class="badge" id="globalCounter">3</span>
    </button>

    <div class="notif-dropdown" id="notifDropdown">
      <div class="notif-item" data-id="1" onclick="openAndReadMessage(this)">
        <span>Maintenance: Courroie B65</span>
        <span class="unread-dot"></span>
      </div>
      <div class="notif-item" data-id="2" onclick="openAndReadMessage(this)">
        <span>Statut Ligne: Zone Préparation</span>
        <span class="unread-dot"></span>
      </div>
      <div class="notif-item" data-id="3" onclick="openAndReadMessage(this)">
        <span>Mise à jour Sage X3 & GMAO</span>
        <span class="unread-dot"></span>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const toggleBtn = document.getElementById("notifToggleBtn");
      const dropdown = document.getElementById("notifDropdown");
      const globalCounter = document.getElementById("globalCounter");

      toggleBtn.addEventListener("click", () => {
        const isVisible = dropdown.style.display === "block";
        dropdown.style.display = isVisible ? "none" : "block";
      });

      window.openAndReadMessage = function(element) {
        const dot = element.querySelector(".unread-dot");

        if (dot && dot.style.display !== "none") {
          dot.style.display = "none";

          let count = parseInt(globalCounter.textContent) || 0;
          if (count > 0) {
            count -= 1;
            globalCounter.textContent = count;

            if (count === 0) {
              globalCounter.style.display = "none";
            }
          }
        }
        dropdown.style.display = "none";
      };
    });
  </script>
</body>
</html>

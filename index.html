<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GMAO PRO V8 - Supabase</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0b1220;
        color: #fff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .box {
        width: 420px;
        max-width: 92%;
        background: #111c30;
        border: 1px solid #263653;
        border-radius: 18px;
        padding: 30px;
        box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }

    h1 {
        text-align: center;
        margin-bottom: 8px;
    }

    .subtitle {
        text-align: center;
        color: #9fb0c9;
        margin-bottom: 25px;
    }

    label {
        display: block;
        margin: 15px 0 7px;
        color: #c9d5e8;
    }

    input {
        width: 100%;
        padding: 13px;
        border-radius: 9px;
        border: 1px solid #344866;
        background: #0b1424;
        color: white;
        outline: none;
    }

    button {
        width: 100%;
        margin-top: 20px;
        padding: 14px;
        border: 0;
        border-radius: 9px;
        background: #1769e0;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #1d7bf5;
    }

    .status {
        margin-top: 20px;
        padding: 12px;
        border-radius: 8px;
        background: #0b1424;
        color: #aebdd1;
        white-space: pre-wrap;
    }

    .success {
        color: #6ee7a0;
    }

    .error {
        color: #ff8585;
    }

    .hidden {
        display: none;
    }

    .dashboard {
        width: 100%;
        max-width: 1000px;
        padding: 30px;
    }

    .header {
        background: #111c30;
        padding: 22px;
        border-radius: 15px;
        margin-bottom: 20px;
    }

    .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit,minmax(180px,1fr));
        gap: 15px;
    }

    .card {
        background: #111c30;
        border: 1px solid #263653;
        padding: 22px;
        border-radius: 15px;
    }

    .value {
        font-size: 25px;
        font-weight: bold;
        margin-top: 8px;
    }

    .logout {
        max-width: 180px;
        background: #a83232;
    }
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="box">

    <h1>GMAO PRO</h1>

    <div class="subtitle">
        Maintenance Management System
    </div>

    <label>Email</label>

    <input
        id="email"
        type="email"
        placeholder="Votre email"
        autocomplete="username"
    >

    <label>Mot de passe</label>

    <input
        id="password"
        type="password"
        placeholder="Votre mot de passe"
        autocomplete="current-password"
    >

    <button onclick="login()">
        Se connecter
    </button>

    <div id="status" class="status">
        En attente de connexion...
    </div>

</div>


<!-- DASHBOARD -->
<div id="dashboardPage" class="dashboard hidden">

    <div class="header">

        <h1>GMAO PRO</h1>

        <p id="userInfo">
            Chargement...
        </p>

        <button class="logout" onclick="logout()">
            Déconnexion
        </button>

    </div>


    <div class="cards">

        <div class="card">
            <div>Utilisateur</div>
            <div class="value" id="userName">-</div>
        </div>

        <div class="card">
            <div>Rôle</div>
            <div class="value" id="userRole">-</div>
        </div>

        <div class="card">
            <div>Code personnel</div>
            <div class="value" id="employeeCode">-</div>
        </div>

        <div class="card">
            <div>Statut</div>
            <div class="value" id="accountStatus">-</div>
        </div>

    </div>

</div>


<script>

/* =========================================================
   SUPABASE CONFIGURATION
   ========================================================= */

const SUPABASE_URL =
    'https://qnrfkfrornozwvgewcw.supabase.co';

const SUPABASE_ANON_KEY =
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSI6InF1bmZrZnJvcm5vd3Znd2Vjd2N3IiwiaWF0IjoxNzg5NzQxMDU4LCJleHAiOjIxMDUzMTcwNTN9.NT4nYxEp0s-qs-ZqNpDhZfUfyRdo7s8u_rinf1xoKP8';

const sb = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


/* =========================================================
   ELEMENTS
   ========================================================= */

const loginPage =
    document.getElementById('loginPage');

const dashboardPage =
    document.getElementById('dashboardPage');

const statusBox =
    document.getElementById('status');


/* =========================================================
   LOGIN
   ========================================================= */

async function login() {

    const email =
        document.getElementById('email').value.trim();

    const password =
        document.getElementById('password').value;

    if (!email || !password) {

        statusBox.innerHTML =
            '<span class="error">Veuillez saisir email et mot de passe.</span>';

        return;
    }

    statusBox.textContent =
        'Connexion à Supabase...';

    const { data, error } =
        await sb.auth.signInWithPassword({
            email: email,
            password: password
        });

    if (error) {

        console.error(error);

        statusBox.innerHTML =
            '<span class="error">Erreur : ' +
            escapeHtml(error.message) +
            '</span>';

        return;
    }

    if (!data.user) {

        statusBox.innerHTML =
            '<span class="error">Utilisateur non trouvé.</span>';

        return;
    }

    await loadProfile(data.user);

}


/* =========================================================
   PROFILE
   ========================================================= */

async function loadProfile(user) {

    statusBox.textContent =
        'Connexion réussie. Chargement du profil...';

    const { data: profile, error } =
        await sb
            .from('profiles')
            .select('*')
            .eq('id', user.id)
            .single();

    if (error) {

        console.error(error);

        statusBox.innerHTML =
            '<span class="error">' +
            'Connexion Supabase réussie mais profil inaccessible.\n\n' +
            escapeHtml(error.message) +
            '</span>';

        return;
    }

    if (!profile) {

        statusBox.innerHTML =
            '<span class="error">Profil introuvable.</span>';

        return;
    }

    if (profile.active === false) {

        await sb.auth.signOut();

        statusBox.innerHTML =
            '<span class="error">Compte désactivé.</span>';

        return;
    }

    showDashboard(user, profile);
}


/* =========================================================
   DASHBOARD
   ========================================================= */

function showDashboard(user, profile) {

    loginPage.classList.add('hidden');

    dashboardPage.classList.remove('hidden');

    document.getElementById('userName').textContent =
        profile.full_name || user.email;

    document.getElementById('userRole').textContent =
        formatRole(profile.role);

    document.getElementById('employeeCode').textContent =
        profile.employee_code || 'Non attribué';

    document.getElementById('accountStatus').textContent =
        profile.active ? 'Actif' : 'Inactif';

    document.getElementById('userInfo').textContent =
        `${user.email} — ${formatRole(profile.role)}`;
}


/* =========================================================
   ROLE
   ========================================================= */

function formatRole(role) {

    const roles = {

        admin:
            'Administrateur',

        manager:
            'Responsable Maintenance',

        technician:
            'Technicien'

    };

    return roles[role] || role || 'Non défini';
}


/* =========================================================
   LOGOUT
   ========================================================= */

async function logout() {

    await sb.auth.signOut();

    dashboardPage.classList.add('hidden');

    loginPage.classList.remove('hidden');

    statusBox.textContent =
        'Déconnecté.';

    document.getElementById('password').value = '';
}


/* =========================================================
   SESSION AUTOMATIQUE
   ========================================================= */

async function checkSession() {

    const {
        data: {
            session
        }
    } = await sb.auth.getSession();

    if (session && session.user) {

        await loadProfile(session.user);

    }
}


/* =========================================================
   AUTH STATE
   ========================================================= */

sb.auth.onAuthStateChange(
    async (event, session) => {

        if (event === 'SIGNED_OUT') {

            dashboardPage.classList.add('hidden');

            loginPage.classList.remove('hidden');

        }

    }
);


/* =========================================================
   SECURITY DISPLAY
   ========================================================= */

function escapeHtml(value) {

    return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');

}


/* =========================================================
   START
   ========================================================= */

checkSession();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GMAO PRO V9 - Connexion</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#07111f;
  color:white;
}

.card{
  width:420px;
  max-width:92%;
  background:#0d1b2d;
  border:1px solid #25415f;
  border-radius:18px;
  padding:30px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.logo{
  width:70px;
  height:70px;
  margin:auto;
  border-radius:18px;
  background:#1677ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  font-weight:bold;
}

h1{
  text-align:center;
  margin:18px 0 5px;
}

.subtitle{
  text-align:center;
  color:#8ea3ba;
  margin-bottom:25px;
}

label{
  display:block;
  margin:15px 0 7px;
  color:#b7c7d9;
}

input{
  width:100%;
  padding:13px;
  border-radius:9px;
  border:1px solid #29445f;
  background:#081522;
  color:white;
  outline:none;
}

input:focus{
  border-color:#1677ff;
}

button{
  width:100%;
  padding:13px;
  margin-top:12px;
  border:0;
  border-radius:9px;
  cursor:pointer;
  font-weight:bold;
}

.login{
  background:#1677ff;
  color:white;
}

.reset{
  background:#243a52;
  color:white;
}

.test{
  background:#15304c;
  color:#9cc8ff;
}

.message{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:8px;
  font-size:13px;
  line-height:1.5;
  white-space:pre-wrap;
}

.error{
  display:block;
  background:#32191d;
  border:1px solid #71363d;
  color:#ff9c9c;
}

.success{
  display:block;
  background:#123323;
  border:1px solid #286b45;
  color:#8ee0ae;
}

#app{
  display:none;
  text-align:center;
}

#diagnostic{
  margin-top:15px;
  color:#8ea3ba;
  font-size:12px;
  white-space:pre-wrap;
  word-break:break-word;
  text-align:left;
}
</style>
</head>

<body>

<div class="card" id="loginPage">

  <div class="logo">G</div>

  <h1>GMAO PRO V9</h1>

  <div class="subtitle">
    Connexion Administrateur
  </div>

  <label>Email</label>

  <input
    id="email"
    type="email"
    value="abdelali.bouzid.98@gmail.com"
    autocomplete="username"
  >

  <label>Mot de passe</label>

  <input
    id="password"
    type="password"
    placeholder="Votre mot de passe Supabase"
    autocomplete="current-password"
  >

  <button
    class="login"
    onclick="login()"
  >
    🔐 Se connecter
  </button>

  <button
    class="reset"
    onclick="resetPassword()"
  >
    🔑 Réinitialiser le mot de passe
  </button>

  <button
    class="test"
    onclick="testConnection()"
  >
    🔎 Tester Supabase
  </button>

  <div id="message" class="message"></div>

  <div id="diagnostic"></div>

</div>


<div class="card" id="app">

  <div class="logo">✓</div>

  <h1>Connexion réussie</h1>

  <p id="welcome"></p>

  <p style="color:#8ea3ba">
    Votre compte Supabase est maintenant connecté à GMAO PRO.
  </p>

  <button
    class="login"
    onclick="logout()"
  >
    Déconnexion
  </button>

</div>


<script>

/* =====================================================
   SUPABASE CONFIGURATION
===================================================== */

const SUPABASE_URL =
  'https://qnrfkfrornozwvgewcwk.supabase.co';

const SUPABASE_ANON_KEY =
  'sb_publishable_DBe5PuyHPvdHnRnqr2lpqw_t4m3C8SY';


const sb =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text,type){

  const box =
    document.getElementById('message');

  box.className =
    'message ' + type;

  box.textContent = text;

}


/* =====================================================
   TEST CONNEXION
===================================================== */

async function testConnection(){

  const diag =
    document.getElementById('diagnostic');

  diag.textContent =
    '⏳ Test en cours...';

  try{

    if(!window.supabase){

      throw new Error(
        'Supabase JS n’est pas chargé.'
      );

    }

    const {
      data,
      error
    } =
    await sb.auth.getSession();

    if(error){

      throw error;

    }

    diag.textContent =
      '✅ SUPABASE OK\n\n' +

      'Project URL:\n' +
      SUPABASE_URL +

      '\n\nSession:\n' +
      (
        data.session
        ? 'ACTIVE'
        : 'Aucune session'
      );

  }
  catch(error){

    diag.textContent =
      '❌ ERREUR\n\n' +
      error.message;

    console.error(error);

  }

}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

  const email =
    document.getElementById('email')
      .value.trim();

  const password =
    document.getElementById('password')
      .value;

  if(!email){

    showMessage(
      'Veuillez saisir votre email.',
      'error'
    );

    return;

  }

  if(!password){

    showMessage(
      'Veuillez saisir votre mot de passe.',
      'error'
    );

    return;

  }

  showMessage(
    '⏳ Connexion...',
    'success'
  );

  try{

    const {
      data,
      error
    } =
    await sb.auth.signInWithPassword({

      email:email,

      password:password

    });


    if(error){

      throw error;

    }


    if(!data.user){

      throw new Error(
        'Utilisateur non retourné par Supabase.'
      );

    }


    /*
      Vérification du profil GMAO
    */

    const {
      data:profile,
      error:profileError
    } =
    await sb

      .from('profiles')

      .select(
        'id,full_name,role,employee_code,active'
      )

      .eq(
        'id',
        data.user.id
      )

      .maybeSingle();


    if(profileError){

      throw new Error(
        'Connexion réussie mais erreur profiles : ' +
        profileError.message
      );

    }


    if(!profile){

      throw new Error(
        'Connexion Supabase réussie.\n\n' +

        'Mais aucun profil GMAO n’est associé à ce compte.\n\n' +

        'UUID:\n' +
        data.user.id
      );

    }


    if(profile.active === false){

      await sb.auth.signOut();

      throw new Error(
        'Ce compte GMAO est désactivé.'
      );

    }


    /*
      SUCCÈS
    */

    document.getElementById('loginPage')
      .style.display='none';

    document.getElementById('app')
      .style.display='block';


    document.getElementById('welcome')
      .innerHTML =

      '<strong>' +
      (profile.full_name || data.user.email) +
      '</strong><br><br>' +

      'Rôle : ' +
      (profile.role || 'Non défini') +

      '<br>' +

      'Code : ' +
      (profile.employee_code || 'Non défini') +

      '<br><br>' +

      'Email : ' +
      data.user.email;


  }
  catch(error){

    console.error(
      'LOGIN ERROR:',
      error
    );


    let msg =
      error.message || 'Erreur inconnue';


    if(
      msg.toLowerCase()
        .includes('invalid login credentials')
    ){

      msg =
        '❌ Email ou mot de passe incorrect.\n\n' +

        'Le compte existe peut-être dans Supabase,\n' +

        'mais le mot de passe utilisé n’est pas celui enregistré dans Authentication.';

    }


    if(
      msg.toLowerCase()
        .includes('invalid api key')
    ){

      msg =
        '❌ Clé API incorrecte.\n\n' +

        'Vérifiez SUPABASE_ANON_KEY.';

    }


    if(
      msg.toLowerCase()
        .includes('failed to fetch')
    ){

      msg =
        '❌ Impossible de contacter Supabase.\n\n' +

        'Vérifiez le Project URL et votre connexion Internet.';

    }


    showMessage(
      msg,
      'error'
    );

  }

}


/* =====================================================
   RESET PASSWORD
===================================================== */

async function resetPassword(){

  const email =
    document.getElementById('email')
      .value.trim();


  if(!email){

    showMessage(
      'Saisissez votre adresse email.',
      'error'
    );

    return;

  }


  showMessage(
    '⏳ Préparation de la réinitialisation...',
    'success'
  );


  try{

    const {
      error
    } =
    await sb.auth.resetPasswordForEmail(

      email,

      {
        redirectTo:
          window.location.origin +
          window.location.pathname
      }

    );


    if(error){

      throw error;

    }


    showMessage(

      '✅ Demande envoyée.\n\n' +

      'Vérifiez votre boîte Gmail :\n' +
      email +

      '\n\n' +

      'Vérifiez également le dossier Spam / Courrier indésirable.',

      'success'

    );

  }
  catch(error){

    console.error(error);

    showMessage(
      'Erreur : ' + error.message,
      'error'
    );

  }

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

  await sb.auth.signOut();

  document.getElementById('app')
    .style.display='none';

  document.getElementById('loginPage')
    .style.display='block';

  document.getElementById('password')
    .value='';

}


/* =====================================================
   START
===================================================== */

testConnection();

</script>

</body>
</html>
